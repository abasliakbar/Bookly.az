openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: booking
    description: Public booking experience
  - name: dashboard
    description: Business owner dashboard
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /booking/{slug}:
    get:
      operationId: getPublicBookingPage
      tags: [booking]
      summary: Get public booking details
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Business booking information
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicBookingPage"
        "404":
          description: Business not found
  /booking/{slug}/availability/{serviceId}/{staffId}/{date}:
    get:
      operationId: getAvailableSlots
      tags: [booking]
      summary: Get available times for a service, staff member, and date
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
        - name: serviceId
          in: path
          required: true
          schema: { type: integer }
        - name: staffId
          in: path
          required: true
          schema: { type: integer }
        - name: date
          in: path
          required: true
          schema: { type: string, pattern: "^\\d{4}-\\d{2}-\\d{2}$" }
      responses:
        "200":
          description: Available local appointment times
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AvailableSlot"
  /booking/{slug}/appointments:
    post:
      operationId: createPublicAppointment
      tags: [booking]
      summary: Create a customer appointment
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookingInput"
      responses:
        "201":
          description: Appointment created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Appointment"
        "409":
          description: The selected time is no longer available
  /dashboard/business:
    get:
      operationId: getDashboardBusiness
      tags: [dashboard]
      summary: Get the signed-in owner's business
      responses:
        "200":
          description: Business profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Business"
        "404":
          description: No business has been set up yet
    post:
      operationId: createDashboardBusiness
      tags: [dashboard]
      summary: Set up a business for the signed-in owner
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BusinessInput"
      responses:
        "201":
          description: Business created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Business"
        "409":
          description: Owner already has a business
    patch:
      operationId: updateDashboardBusiness
      tags: [dashboard]
      summary: Update business profile and working hours
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BusinessUpdate"
      responses:
        "200":
          description: Updated business
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Business"
  /dashboard/overview:
    get:
      operationId: getDashboardOverview
      tags: [dashboard]
      summary: Get today's appointments and business performance
      responses:
        "200":
          description: Dashboard overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardOverview"
  /dashboard/appointments:
    get:
      operationId: getDashboardAppointments
      tags: [dashboard]
      summary: List appointments for a calendar date
      parameters:
        - name: date
          in: query
          required: false
          schema: { type: string, format: date }
      responses:
        "200":
          description: Appointments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Appointment"
  /dashboard/appointments/{id}:
    patch:
      operationId: updateAppointmentStatus
      tags: [dashboard]
      summary: Change an appointment status
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppointmentStatusUpdate"
      responses:
        "200":
          description: Updated appointment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Appointment"
        "404":
          description: Appointment not found
  /dashboard/services:
    get:
      operationId: getDashboardServices
      tags: [dashboard]
      summary: List business services
      responses:
        "200":
          description: Services
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Service"
    post:
      operationId: createService
      tags: [dashboard]
      summary: Add a service
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServiceInput"
      responses:
        "201":
          description: Service created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Service"
  /dashboard/services/{id}:
    patch:
      operationId: updateService
      tags: [dashboard]
      summary: Update a service
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServiceUpdate"
      responses:
        "200":
          description: Updated service
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Service"
        "404":
          description: Service not found
    delete:
      operationId: deleteService
      tags: [dashboard]
      summary: Remove a service
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Service removed
        "404":
          description: Service not found
  /dashboard/staff:
    get:
      operationId: getDashboardStaff
      tags: [dashboard]
      summary: List staff members
      responses:
        "200":
          description: Staff members
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Staff"
    post:
      operationId: createStaff
      tags: [dashboard]
      summary: Add a staff member
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StaffInput"
      responses:
        "201":
          description: Staff member created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Staff"
  /dashboard/staff/{id}:
    patch:
      operationId: updateStaff
      tags: [dashboard]
      summary: Update a staff member
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StaffUpdate"
      responses:
        "200":
          description: Updated staff member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Staff"
        "404":
          description: Staff member not found
    delete:
      operationId: deleteStaff
      tags: [dashboard]
      summary: Remove a staff member
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Staff member removed
        "404":
          description: Staff member not found
  /dashboard/customers:
    get:
      operationId: getDashboardCustomers
      tags: [dashboard]
      summary: List customers and visit history
      responses:
        "200":
          description: Customers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Customer"
  /dashboard/holidays:
    get:
      operationId: getDashboardHolidays
      tags: [dashboard]
      summary: List business holidays
      responses:
        "200":
          description: Business holidays
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Holiday"
    post:
      operationId: createDashboardHoliday
      tags: [dashboard]
      summary: Add a business holiday
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HolidayInput"
      responses:
        "201":
          description: Holiday created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Holiday"
  /dashboard/holidays/{id}:
    delete:
      operationId: deleteDashboardHoliday
      tags: [dashboard]
      summary: Remove a business holiday
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Holiday removed
        "404":
          description: Holiday not found
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    WorkingDay:
      type: object
      properties:
        open: { type: string, pattern: "^[0-2][0-9]:[0-5][0-9]$" }
        close: { type: string, pattern: "^[0-2][0-9]:[0-5][0-9]$" }
        closed: { type: boolean }
      required: [open, close, closed]
    WorkingHours:
      type: object
      additionalProperties:
        $ref: "#/components/schemas/WorkingDay"
    Business:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        slug: { type: string }
        category: { type: string }
        phone: { type: string }
        address: { type: string }
        timezone: { type: string }
        currency: { type: string }
        workingHours:
          $ref: "#/components/schemas/WorkingHours"
      required: [id, name, slug, category, phone, address, timezone, currency, workingHours]
    BusinessInput:
      type: object
      properties:
        name: { type: string, minLength: 2 }
        category: { type: string, minLength: 2 }
        phone: { type: string, minLength: 5 }
        address: { type: string }
      required: [name, category, phone, address]
    BusinessUpdate:
      type: object
      properties:
        name: { type: string, minLength: 2 }
        category: { type: string, minLength: 2 }
        phone: { type: string, minLength: 5 }
        address: { type: string }
        workingHours:
          $ref: "#/components/schemas/WorkingHours"
    Service:
      type: object
      properties:
        id: { type: integer }
        businessId: { type: integer }
        name: { type: string }
        durationMinutes: { type: integer }
        price: { type: number }
        active: { type: boolean }
      required: [id, businessId, name, durationMinutes, price, active]
    ServiceInput:
      type: object
      properties:
        name: { type: string, minLength: 2 }
        durationMinutes: { type: integer, minimum: 10, maximum: 480 }
        price: { type: number, minimum: 0 }
      required: [name, durationMinutes, price]
    ServiceUpdate:
      type: object
      properties:
        name: { type: string, minLength: 2 }
        durationMinutes: { type: integer, minimum: 10, maximum: 480 }
        price: { type: number, minimum: 0 }
        active: { type: boolean }
    Staff:
      type: object
      properties:
        id: { type: integer }
        businessId: { type: integer }
        name: { type: string }
        serviceIds:
          type: array
          items: { type: integer }
        workingHours:
          $ref: "#/components/schemas/WorkingHours"
        active: { type: boolean }
      required: [id, businessId, name, serviceIds, workingHours, active]
    StaffInput:
      type: object
      properties:
        name: { type: string, minLength: 2 }
        serviceIds:
          type: array
          items: { type: integer }
        workingHours:
          $ref: "#/components/schemas/WorkingHours"
      required: [name, serviceIds]
    StaffUpdate:
      type: object
      properties:
        name: { type: string, minLength: 2 }
        serviceIds:
          type: array
          items: { type: integer }
        workingHours:
          $ref: "#/components/schemas/WorkingHours"
        active: { type: boolean }
    Appointment:
      type: object
      properties:
        id: { type: integer }
        serviceId: { type: integer }
        staffId: { type: integer }
        serviceName: { type: string }
        staffName: { type: string }
        customerName: { type: string }
        customerPhone: { type: string }
        customerEmail: { type: ["string", "null"] }
        startTime: { type: string, format: date-time }
        endTime: { type: string, format: date-time }
        status:
          type: string
          enum: [pending, confirmed, cancelled, completed]
        notes: { type: ["string", "null"] }
      required: [id, serviceId, staffId, serviceName, staffName, customerName, customerPhone, customerEmail, startTime, endTime, status, notes]
    BookingInput:
      type: object
      properties:
        serviceId: { type: integer }
        staffId: { type: integer }
        startTime: { type: string, format: date-time }
        customerName: { type: string, minLength: 2 }
        customerPhone: { type: string, minLength: 5 }
        customerEmail: { type: ["string", "null"], format: email }
        notes: { type: ["string", "null"] }
      required: [serviceId, staffId, startTime, customerName, customerPhone]
    AppointmentStatusUpdate:
      type: object
      properties:
        status:
          type: string
          enum: [confirmed, cancelled, completed]
      required: [status]
    AvailableSlot:
      type: object
      properties:
        time: { type: string, pattern: "^[0-2][0-9]:[0-5][0-9]$" }
      required: [time]
    PublicBookingPage:
      type: object
      properties:
        business:
          $ref: "#/components/schemas/Business"
        services:
          type: array
          items:
            $ref: "#/components/schemas/Service"
        staff:
          type: array
          items:
            $ref: "#/components/schemas/Staff"
      required: [business, services, staff]
    DashboardOverview:
      type: object
      properties:
        business:
          $ref: "#/components/schemas/Business"
        todayAppointments:
          type: array
          items:
            $ref: "#/components/schemas/Appointment"
        monthlyRevenue: { type: number }
        popularService: { type: ["string", "null"] }
        occupancyPercent: { type: integer, minimum: 0, maximum: 100 }
        totalCustomers: { type: integer }
      required: [business, todayAppointments, monthlyRevenue, popularService, occupancyPercent, totalCustomers]
    Customer:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        phone: { type: string }
        email: { type: ["string", "null"] }
        totalVisits: { type: integer }
        lastVisit: { type: ["string", "null"], format: date-time }
      required: [id, name, phone, email, totalVisits, lastVisit]
    Holiday:
      type: object
      properties:
        id: { type: integer }
        date: { type: string, pattern: "^\\d{4}-\\d{2}-\\d{2}$" }
        label: { type: string }
      required: [id, date, label]
    HolidayInput:
      type: object
      properties:
        date: { type: string, pattern: "^\\d{4}-\\d{2}-\\d{2}$" }
        label: { type: string }
      required: [date]

